[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "botonomus"
dynamic = ["version"]
description = "Stealth browser automation on real Chrome: native CDP driver, C++-level personas, async session pools"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Botonomus contributors" }]
keywords = ["browser automation", "chrome", "cdp", "stealth", "anti-detect", "fingerprint", "scraping", "playwright"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.16,<4",
    "psutil>=6,<8",
    "tzdata>=2025.1; sys_platform == 'win32'",
]

[project.scripts]
botonomus = "botonomus.cli.main:main"

[project.urls]
Homepage = "https://github.com/Kuduxaaa/botonomus"
Documentation = "https://kuduxaaa.github.io/botonomus"
Changelog = "https://github.com/Kuduxaaa/botonomus/blob/main/CHANGELOG.md"
Issues = "https://github.com/Kuduxaaa/botonomus/issues"

[project.optional-dependencies]
playwright = ["playwright>=1.60,<2"]
patchright = ["patchright>=1.60,<2"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.5,<10", "mkdocstrings[python]>=0.26,<2"]
dev = ["playwright>=1.60,<2", "patchright>=1.60,<2", "pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-psutil", "build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
botonomus = ["py.typed", "diagnostics/assets/*.html", "diagnostics/assets/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["browser: real browser tests (opt in with BOTONOMUS_BROWSER_TESTS=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# Public API mirrors Playwright: per-call timeout arguments are intentional.
ignore = ["ASYNC109"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.setuptools.dynamic]
version = { attr = "botonomus._version.__version__" }
